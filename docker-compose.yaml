name: wiki-rag-mcp

services:
  vector-db:
    image: qdrant/qdrant:latest
    container_name: wiki_vector_db
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage
    restart: unless-stopped

  ingestor:
    build:
      context: .
      dockerfile: Dockerfile.ingestor
    container_name: wiki_ingestor
    environment:
      - WIKI_TYPE=mediawiki
      - WIKI_URL=https://en.wikipedia.org/w
      - QDRANT_HOST=vector-db
      - QDRANT_PORT=6333
      - EMBED_MODEL_URL=http://host.docker.internal:1234/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - vector-db

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: wiki_mcp_server
    ports:
      - "8080:8080"
    environment:
      - QDRANT_HOST=vector-db
      - QDRANT_PORT=6333
      - EMBED_MODEL_URL=http://host.docker.internal:1234/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - vector-db
    restart: unless-stopped